{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="text-center max-w-md">
        <div class="w-24 h-24 bg-wine/10 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-wine/40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
        </div>
        <h1 class="font-display text-6xl font-bold text-wine mb-4">500</h1>
        <h2 class="font-display text-2xl font-bold text-ink mb-3">Something Went Wrong</h2>
        <p class="text-ink/50 mb-8">We encountered an unexpected error. Please try again later or go back to the homepage.</p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{{ url_for('home') }}" class="px-8 py-3 bg-gradient-to-r from-amber to-amber-dark text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                Go Home
            </a>
        </div>
    </div>
</section>
{% endblock %}
